<div class="services-page page-shell py-4">
  <div class="section-header">
    <div>
      <h2>All Services</h2>
      <p>Browse and book available workshop services</p>
    </div>
  </div>

  @if (loading) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
  } @else if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  } @else {
    <div class="row g-4">
      @for (service of services; track service._id) {
        <div class="col-md-6 col-lg-4">
          <app-service-card [service]="service" (book)="book($event)" />
        </div>
      }
    </div>
  }
</div>

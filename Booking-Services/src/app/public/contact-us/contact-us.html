      <div class="col-lg-7">
        <div class="contact-form-card">
          @if (sent) {
            <div class="alert alert-success">Thank you! Your message has been sent. We will get back to you soon.</div>
          }
          <h4 class="mb-4">Send a Message</h4>
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            @if (submitted && form.invalid) {
              <div class="form-validation-summary">Please correct the highlighted fields before sending your message.</div>
            }
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label required">Name</label>
                <input
                  type="text"
                  class="form-control"
                  [class.is-invalid]="invalid('name')"
                  formControlName="name"
                  placeholder="Your full name"
                />
                <app-field-error [control]="form.get('name')" label="Name" [submitted]="submitted" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label required">Email</label>
                <input
                  type="email"
                  class="form-control"
                  [class.is-invalid]="invalid('email')"
                  formControlName="email"
                  placeholder="you@example.com"
                />
                <app-field-error [control]="form.get('email')" label="Email" [submitted]="submitted" />
              </div>
              <div class="col-12 mb-3">
                <label class="form-label required">Subject</label>
                <input
                  type="text"
                  class="form-control"
                  [class.is-invalid]="invalid('subject')"
                  formControlName="subject"
                  placeholder="How can we help?"
                />
                <app-field-error [control]="form.get('subject')" label="Subject" [submitted]="submitted" />
              </div>
              <div class="col-12 mb-3">
                <label class="form-label required">Message</label>
                <textarea
                  class="form-control"
                  [class.is-invalid]="invalid('message')"
                  formControlName="message"
                  rows="5"
                  placeholder="Write your message here (minimum 10 characters)"
                ></textarea>
                <app-field-error [control]="form.get('message')" label="Message" [submitted]="submitted" />
              </div>
            </div>
            <button type="submit" class="btn btn-accent">Send Message</button>
          </form>
        </div>
      </div>
